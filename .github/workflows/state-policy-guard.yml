name: Flutter quality and state policy

on:
  pull_request:
    paths:
      - "dart_edition/lib/**"
      - "dart_edition/test/**"
      - "dart_edition/tool/**"
      - "dart_edition/pubspec.yaml"
      - "dart_edition/pubspec.lock"
      - ".github/workflows/state-policy-guard.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "dart_edition/lib/**"
      - "dart_edition/test/**"
      - "dart_edition/tool/**"
      - "dart_edition/pubspec.yaml"
      - "dart_edition/pubspec.lock"
      - ".github/workflows/state-policy-guard.yml"

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dart_edition

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Enforce initState provider assignment policy
        run: dart run tool/check_initstate_provider_assignments.dart

      - name: Generate source files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are committed
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  large-data-regression:
    name: Large-data and memory regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dart_edition

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run bounded-work and large-data regressions
        run: >-
          flutter test
          test/findreplace_performance_benchmark_test.dart
          test/findreplace_latest_wins_test.dart
          test/findreplace_results_cap_test.dart
          test/cancellable_compute_test.dart
          test/text_position_index_test.dart
          test/word_count_service_test.dart
          --reporter expanded
